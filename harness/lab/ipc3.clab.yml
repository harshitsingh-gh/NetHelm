name: ipc3

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.6.1

  nodes:
    r1:
      binds:
        - /home/harshitsingh/projects/NetHelm/harness/lab/ipc3/configs/r1/daemons:/etc/frr/daemons
        - /home/harshitsingh/projects/NetHelm/harness/lab/ipc3/configs/r1/frr.conf:/etc/frr/frr.conf

    r2:
      binds:
        - /home/harshitsingh/projects/NetHelm/harness/lab/ipc3/configs/r2/daemons:/etc/frr/daemons
        - /home/harshitsingh/projects/NetHelm/harness/lab/ipc3/configs/r2/frr.conf:/etc/frr/frr.conf

    r3:
      binds:
        - /home/harshitsingh/projects/NetHelm/harness/lab/ipc3/configs/r3/daemons:/etc/frr/daemons
        - /home/harshitsingh/projects/NetHelm/harness/lab/ipc3/configs/r3/frr.conf:/etc/frr/frr.conf
      exec:
        - ip link add dum0 type dummy
        - ip addr add 203.0.113.1/24 dev dum0
        - ip link set dum0 up

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
